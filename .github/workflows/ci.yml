name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmd
          POSTGRES_PASSWORD: pmd
          POSTGRES_DB: pmd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pmd:pmd@localhost:5432/pmd?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
